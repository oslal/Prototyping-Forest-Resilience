<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototype — Prototyping Forest Resilience</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ffffff;
      font-family: 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 48px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .project-name {
      font-size: 12px;
      letter-spacing: -0.25 em;
      color: #000000;
      font-family: 'Helvetica Neue', sans-serif;
    }

    .species-name {
      font-size: 32px;
      letter-spacing: -1.0 em;
      font-weight: normal;
      color: #000000;
    }

    model-viewer {
      width: 50vw;
      height: 50vh;
      background-color: #ffffff;
      --progress-bar-color: transparent;
    }
  </style>
</head>
<body>

  <header>
    <span class="project-name">Prototyping Forest Resilience</span>
<span class="species-name">Trait-Based Prototype</span>
  </header>

  <model-viewer
src="260531-683_Prototype-004.glb"
    alt=“Prototype"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="12deg"
    shadow-intensity="0.6"
    shadow-softness="1"
    environment-image="neutral"
    exposure="1.1"
    camera-orbit="45deg 70deg 2.5m"
    tone-mapping="neutral">
  </model-viewer>

</body>
</html>
